name: CI

on:
    pull_request:
    push:
        branches: [main]

jobs:
    check:
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: backend
        steps:
            - uses: actions/checkout@v4
              with:
                  path: backend
            - uses: actions/setup-node@v4
              with:
                  node-version-file: backend/.nvmrc
                  cache: npm
                  cache-dependency-path: backend/package-lock.json
            - run: npm ci
            - run: npm run check
            - run: npm run check:runtime
            - uses: actions/checkout@v4
              with:
                  repository: mesh-fire-detection/web
                  ref: main
                  path: web
                  persist-credentials: false
            - run: npm run check:contract
