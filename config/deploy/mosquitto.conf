# /etc/mosquitto/conf.d/mesh.conf — our own broker. Never the public Meshtastic one.

per_listener_settings false
allow_anonymous false
password_file /etc/mosquitto/passwd
acl_file /etc/mosquitto/acl

persistence true
persistence_location /var/lib/mosquitto/

# The backend connects over loopback.
listener 1883 127.0.0.1

# Gateways connect from the field over TLS. The certificate comes from Let's
# Encrypt by DNS-01, because mqtt.meshfiredetection.org is grey-cloud in
# Cloudflare and so can use neither an edge certificate nor HTTP-01.
# mosquitto-certs.sh installs it on issue and on every renewal.
listener 8883 0.0.0.0
certfile /etc/mosquitto/certs/fullchain.pem
keyfile /etc/mosquitto/certs/privkey.pem

# Fallback only, and a decision to record if used: docs/MQTT.md notes that
# some gateway firmware reboot-loops with TLS enabled. If that proves true of
# the hardware in the field, uncomment this and open 1884 instead of 8883.
# listener 1884 0.0.0.0
