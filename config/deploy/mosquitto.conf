# /etc/mosquitto/conf.d/mesh.conf — our own broker. Never the public Meshtastic one.

per_listener_settings false
allow_anonymous false
password_file /etc/mosquitto/passwd
acl_file /etc/mosquitto/acl

persistence true
persistence_location /var/lib/mosquitto/

# The backend connects over loopback.
listener 1883 127.0.0.1

# Gateways connect from the field. Start without TLS; switch to the 8883
# listener once TLS is confirmed stable on the gateway hardware (some
# firmware has reboot-looped with TLS enabled).
listener 1884 0.0.0.0

# listener 8883 0.0.0.0
# certfile /etc/mosquitto/certs/fullchain.pem
# keyfile /etc/mosquitto/certs/privkey.pem
